<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Busca DOU</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px 64px;
    color: #1a1a1a;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  p.subtitulo {
    color: #555;
    margin-top: 0;
    margin-bottom: 24px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 12px 20px;
    font-size: 1rem;
    background: #1351b4;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #0d3f8f; }
  button:disabled { background: #999; cursor: default; }
  #status {
    margin-bottom: 16px;
    color: #555;
  }
  .resultado {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .resultado h2 {
    font-size: 1.05rem;
    margin: 0 0 8px;
  }
  .resultado h2 a {
    color: #1351b4;
    text-decoration: none;
  }
  .resultado h2 a:hover { text-decoration: underline; }
  .meta {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 8px;
  }
  .trecho {
    font-size: 0.95rem;
    color: #333;
    line-height: 1.4;
  }
  .trecho mark {
    background: #fff3a3;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Busca DOU</h1>
  <p class="subtitulo">Pesquise publicações no Diário Oficial da União por palavra-chave.</p>

  <form id="form-busca">
    <input type="text" id="campo-termo" placeholder="Ex: PDRS" autocomplete="off" required />
    <button type="submit" id="botao-buscar">Buscar</button>
  </form>

  <div id="status"></div>
  <div id="resultados"></div>
</div>

<script>
const form = document.getElementById('form-busca');
const campoTermo = document.getElementById('campo-termo');
const botaoBuscar = document.getElementById('botao-buscar');
const statusEl = document.getElementById('status');
const resultadosEl = document.getElementById('resultados');

function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}

function renderizarTrecho(trecho) {
  return escapeHtml(trecho);
}

form.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  const termo = campoTermo.value.trim();
  if (!termo) return;

  botaoBuscar.disabled = true;
  statusEl.textContent = 'Buscando...';
  resultadosEl.innerHTML = '';

  try {
    const resposta = await fetch(`/buscar?q=${encodeURIComponent(termo)}`);
    const dados = await resposta.json();

    if (!resposta.ok) {
      statusEl.textContent = dados.erro || 'Erro ao buscar.';
      return;
    }

    const resultados = dados.resultados || [];

    if (resultados.length === 0) {
      statusEl.textContent = 'Nenhum resultado encontrado.';
      return;
    }

    statusEl.textContent = `${resultados.length} resultado(s) encontrado(s) (primeira página).`;

    resultadosEl.innerHTML = resultados.map((item) => `
      <div class="resultado">
        <h2><a href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.titulo)}</a></h2>
        <div class="meta">${escapeHtml(item.orgao || '')} · ${escapeHtml(item.secao || '')} · ${escapeHtml(item.data || '')}</div>
        <div class="trecho">${renderizarTrecho(item.trecho)}</div>
      </div>
    `).join('');
  } catch (erro) {
    statusEl.textContent = 'Erro ao conectar com o servidor.';
  } finally {
    botaoBuscar.disabled = false;
  }
});
</script>
</body>
</html>
